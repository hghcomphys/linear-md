[project]
authors = ["Hossein Ghorbanfekr <hgh.comphys@gmail.com>"]
channels = ["conda-forge"]
description = "Implementing Linear molecular dynamics from scratch"
name = "linear-md"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"
numba = ">=0.65.1,<0.66"
